<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pela régua de Tarcísio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="A simulação de Tarcísio refeita com os dados do TSE: mapa por estado, premissas à mostra, pesquisas, eleitor provável e teste em todas as eleições desde 1989.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap">
<style>
/* Layout: matéria em coluna estreita, com módulos de dados que abrem para 1100px (mapa com painel lateral, gráfico de pesquisas, cartões por estado). */
:root{
  --bg:#ffffff; --surface:#ffffff; --surface-2:#f3f5f6; --ink:#16191c; --ink-2:#555c63; --ink-3:#868d94; --rule:#e1e4e7;
  --brand:#0d5955; --brand-ink:#ffffff;
  --mapa:#22282d; --mapa-uf:#5b646c; --mapa-borda:#22282d; --mapa-txt:#f2f4f5;
  --lula:#d1262c; --lula-2:#ec8a86; --lula-3:#f8cfcc;
  --flavio:#26358f; --flavio-2:#7d88cc; --flavio-3:#cdd2ef;
  --video:#b07a0f; --video-f:rgba(176,122,15,.17); --v1:#f3dfb0; --v2:#e2b65a; --v3:#b07a0f; --v4:#7a5205;
  --razo:#0b7a71; --razo-f:rgba(11,122,113,.15);
  --ok:#1f8a4c; --bad:#c62828; --sel:#16191c;
  --sans:"Public Sans", "Segoe UI", Roboto, Arial, sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#111416; --surface:#181c1f; --surface-2:#20262a; --ink:#e9ecee; --ink-2:#aab2b9; --ink-3:#7c858c; --rule:#2c3338;
  --brand:#0f4b48; --brand-ink:#e6f3f2;
  --mapa:#0b0e10; --mapa-uf:#3a4248; --mapa-borda:#0b0e10; --mapa-txt:#e9ecee;
  --lula:#f2645c; --lula-2:#b8403b; --lula-3:#5e2724; --flavio:#8796ea; --flavio-2:#4d5bb0; --flavio-3:#2a3160;
  --video:#e0a845; --video-f:rgba(224,168,69,.2); --v1:#4a3a17; --v2:#7d5f1f; --v3:#b98a2d; --v4:#e8b85a;
  --razo:#4cc0b3; --razo-f:rgba(76,192,179,.18); --ok:#52c48c; --bad:#f2827a; --sel:#ffffff; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#111416; --surface:#181c1f; --surface-2:#20262a; --ink:#e9ecee; --ink-2:#aab2b9; --ink-3:#7c858c; --rule:#2c3338;
  --brand:#0f4b48; --brand-ink:#e6f3f2;
  --mapa:#0b0e10; --mapa-uf:#3a4248; --mapa-borda:#0b0e10; --mapa-txt:#e9ecee;
  --lula:#f2645c; --lula-2:#b8403b; --lula-3:#5e2724; --flavio:#8796ea; --flavio-2:#4d5bb0; --flavio-3:#2a3160;
  --video:#e0a845; --video-f:rgba(224,168,69,.2); --v1:#4a3a17; --v2:#7d5f1f; --v3:#b98a2d; --v4:#e8b85a;
  --razo:#4cc0b3; --razo-f:rgba(76,192,179,.18); --ok:#52c48c; --bad:#f2827a; --sel:#ffffff; color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--brand)}
a{color:inherit;text-underline-offset:3px}
:focus-visible{outline:2px solid var(--flavio);outline-offset:2px}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.col{max-width:660px;margin:0 auto}
.largo{max-width:1100px;margin:0 auto}

.topo{background:var(--brand);color:var(--brand-ink);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.topo .in{max-width:1100px;margin:0 auto;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;height:54px}
.marca{font-weight:800;font-size:19px;letter-spacing:-.01em;text-decoration:none;color:var(--brand-ink);white-space:nowrap}
.marca span{font-weight:400}
.secao-nome{font-size:15px;font-weight:500;letter-spacing:.06em;text-transform:uppercase}
.topo nav{justify-self:end;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;min-width:0}
.topo nav a{font-size:13px;font-weight:600;text-decoration:none;color:var(--brand-ink);opacity:.85;padding:6px 8px;border-radius:4px;white-space:nowrap}
.topo nav a:hover{opacity:1;background:rgba(255,255,255,.12)}

/* cabeça da matéria */
.cabeca{padding-block:30px 6px}
.chapeu{font-size:14px;font-weight:700;color:var(--brand);margin:0 0 10px}
h1{font-weight:800;font-size:clamp(28px,4.4vw,40px);line-height:1.12;letter-spacing:-.018em;margin:0 0 12px;text-wrap:balance}
.fina{font-size:17px;line-height:1.5;color:var(--ink-2);margin:0 0 16px}
.byline{font-size:13px;color:var(--ink-2);display:grid;gap:2px}
.byline b{color:var(--ink);font-weight:700}
.resumo{border:1px solid var(--rule);border-radius:8px;margin:20px 0 6px;background:var(--surface)}
.resumo summary{cursor:pointer;padding:12px 16px;font-weight:700;font-size:14.5px}
.resumo ul{margin:0;padding:0 18px 14px 34px;font-size:15px}
.resumo li{margin:6px 0}

/* texto */
.texto p{margin:0 0 1em;font-size:17px;line-height:1.62;text-wrap:pretty}
.texto h2{font-size:24px;font-weight:800;line-height:1.2;letter-spacing:-.01em;margin:1.7em 0 .5em;text-wrap:balance}
.texto h3{font-size:19px;font-weight:700;margin:1.4em 0 .4em}
.legenda{font-size:13px;color:var(--ink-3);margin:8px 0 0;line-height:1.45}

/* módulos */
.modulo{margin:28px auto 34px}
.mod-cab{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.mod-cab h3{font-size:20px;font-weight:800;margin:0;line-height:1.2}
.mod-cab p{margin:2px 0 0;font-size:13.5px;color:var(--ink-2)}
.cartao{background:var(--surface);border:1px solid var(--rule);border-radius:8px;padding:16px;min-width:0}
.abas{display:flex;background:var(--surface-2);border-radius:8px;padding:3px;gap:3px;flex-wrap:wrap}
.abas button{flex:1;font:inherit;font-size:13.5px;font-weight:600;padding:7px 12px;border:0;border-radius:6px;background:transparent;color:var(--ink-2);cursor:pointer;white-space:nowrap}
.abas button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 0 0 1px var(--rule)}
.pilulas{display:flex;flex-wrap:wrap;gap:6px}
.pilulas button{font:inherit;font-size:13px;font-weight:600;padding:5px 12px;border:1px solid var(--rule);border-radius:6px;background:var(--surface);color:var(--ink);cursor:pointer}
.pilulas button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.turno{display:flex;gap:18px;font-size:13.5px}
.turno button{font:inherit;font-size:14px;font-weight:600;border:0;background:none;color:var(--ink-3);padding:6px 0;border-bottom:2px solid transparent;cursor:pointer}
.turno button[aria-pressed="true"]{color:var(--ink);border-color:var(--lula)}
select{font:inherit;font-size:14px;padding:7px 10px;border:1px solid var(--rule);border-radius:6px;background:var(--surface);color:var(--ink)}
.rot{font-size:12.5px;color:var(--ink-3);font-weight:600;display:block;margin-bottom:4px}
.filtros{display:flex;flex-wrap:wrap;gap:14px 28px;align-items:flex-end;padding:14px 16px;border:1px solid var(--rule);border-radius:8px;margin-bottom:14px;background:var(--surface)}

/* mapa */
.mapa-g{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:0;border:1px solid var(--rule);border-radius:8px;overflow:hidden}
.palco{background:var(--mapa);position:relative;min-width:0;padding:12px}
.palco svg{display:block;width:100%;height:auto;max-height:640px}
.palco path{cursor:pointer;transition:opacity .15s}
.legenda-mapa{position:absolute;left:12px;top:12px;background:rgba(20,24,27,.82);color:#f2f4f5;border-radius:6px;padding:8px 10px;font-size:11.5px;display:grid;gap:4px;max-width:210px}
.legenda-mapa b{font-size:11.5px}
.legenda-mapa .lin{display:flex;align-items:center;gap:6px}
.legenda-mapa i{width:11px;height:11px;border-radius:2px;display:inline-block}
.lateral{background:var(--surface);border-left:1px solid var(--rule);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.lat-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.lat-top h4{margin:0;font-size:18px;font-weight:800}
.cand{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:4px 10px;align-items:center;padding:10px 0;border-top:1px solid var(--rule)}
.cand:first-of-type{border-top:0}
.av{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:14px;color:#fff;grid-row:span 2}
.cand .nm{font-size:14px;font-weight:600}
.cand .nm small{color:var(--ink-3);font-weight:400;margin-left:4px}
.partido{font-size:11px;font-weight:800;color:#fff;border-radius:4px;padding:1px 6px;justify-self:end}
.cand .pc{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
.cand .vt{font-size:12px;color:var(--ink-3);justify-self:end;font-variant-numeric:tabular-nums}
.barrinha{grid-column:2 / 4;height:4px;background:var(--surface-2);border-radius:2px;overflow:hidden}
.barrinha i{display:block;height:100%}
.eleito{display:inline-block;font-size:11px;font-weight:800;background:var(--ok);color:#fff;border-radius:4px;padding:1px 6px;margin-right:6px;vertical-align:2px}
.totais{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;text-align:center;border-top:1px solid var(--rule);padding-top:12px}
.totais div{font-size:12px;color:var(--ink-2)}
.totais b{display:block;font-size:15px;color:var(--ink);font-variant-numeric:tabular-nums}
.comp-proj{font-size:13px;color:var(--ink-2);border-top:1px solid var(--rule);padding-top:10px}
.comp-proj b{color:var(--ink)}
.mini{font:inherit;font-size:12.5px;font-weight:600;padding:4px 10px;border:1px solid var(--rule);border-radius:6px;background:transparent;color:var(--ink);cursor:pointer}

/* cartões de modelo */
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.g4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.modelo{border-top:4px solid var(--c);display:flex;flex-direction:column;gap:8px}
.modelo .quem{font-size:13px;font-weight:700;color:var(--ink-2)}
.modelo .num{font-weight:800;font-size:40px;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.modelo .num small{font-size:15px;font-weight:600;margin-left:6px;color:var(--ink-2);letter-spacing:0}
.modelo .prob{font-size:14px;font-weight:700}
.modelo ul{margin:0;padding:10px 0 0;list-style:none;display:grid;gap:5px;font-size:13.5px;color:var(--ink-2);border-top:1px solid var(--rule)}
.modelo li b{color:var(--ink);font-weight:600}
.etq{display:inline-block;font-size:11.5px;font-weight:700;padding:1px 7px;border-radius:4px;border:1px solid currentColor;white-space:nowrap}
.etq.def{color:var(--video)} .etq.ant{color:var(--razo)} .etq.real{color:var(--lula)} .etq.est{color:var(--ink-2)}
.cl{color:var(--lula)} .cf{color:var(--flavio)}

/* premissas */
.livro .lin{display:grid;grid-template-columns:1.1fr 1fr 1fr 1fr;border-top:1px solid var(--rule)}
.livro .lin > div{padding:10px 12px;font-size:14px;min-width:0}
.livro .cab-l > div{font-size:12.5px;font-weight:700;color:var(--ink-2)}
.livro .lin > div:first-child{font-weight:700}
.livro .v{background:var(--video-f)} .livro .r{background:var(--razo-f)}
.livro .lin > div[data-r]::before{content:attr(data-r);display:none;font-size:11.5px;font-weight:700;color:var(--ink-3)}

/* laboratório */
.lab-g{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,400px);gap:12px;align-items:start}
.res-lab{position:sticky;top:66px}
.ctl{display:grid;gap:6px;padding:14px 0;border-top:1px solid var(--rule)}
.ctl:first-child{border-top:0;padding-top:0}
.ctl .linha{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.ctl label,.ctl .lbl{font-size:14.5px;font-weight:700}
.ctl output{font-variant-numeric:tabular-nums;font-weight:800;min-width:5.5em;text-align:right}
.ctl input[type=range]{width:100%;accent-color:var(--brand)}
.ctl .linha input[type=range]{flex:1;width:auto;min-width:140px}
.ctl .ajuda{font-size:12.5px;color:var(--ink-3)}
.ctl .ef{font-size:13px;color:var(--ink-2)}
.ctl .ef b{color:var(--ink)}
.placar{display:flex;gap:20px;flex-wrap:wrap;align-items:flex-end}
.placar .nm{font-size:12.5px;font-weight:700;color:var(--ink-2)}
.placar .pc{font-weight:800;font-size:38px;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.selo{display:inline-block;font-size:12.5px;font-weight:800;padding:3px 8px;border-radius:5px;background:var(--surface-2)}
.veredito{font-size:13.5px;margin:6px 0 0}

/* pesquisas */
.avs{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0 4px}
.avs button{font:inherit;background:none;border:0;display:grid;justify-items:center;gap:4px;cursor:pointer;color:var(--ink-2);font-size:12px;padding:0;width:74px;text-align:center;line-height:1.25}
.avs button .av{width:44px;height:44px;box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--c);transition:opacity .15s}
.avs button[aria-pressed="false"] .av{opacity:.3;box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--rule)}
.avs button[aria-pressed="false"]{color:var(--ink-3)}

/* estados e histórico */
.ufs{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.uf{border:1px solid var(--rule);border-radius:8px;padding:10px 12px;background:var(--surface);display:grid;gap:6px;min-width:0}
.uf .t{display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.uf .t b{font-size:14px}
.uf .t span{font-size:12.5px;font-weight:800;color:var(--video)}
.uf .lb{display:grid;grid-template-columns:52px minmax(0,1fr) 44px;gap:6px;align-items:center;font-size:12px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.uf .tr{position:relative;height:10px;background:var(--flavio-3);border-radius:2px;overflow:hidden}
.uf .tr i{position:absolute;left:0;top:0;bottom:0;background:var(--lula)}
.uf .tr::after{content:"";position:absolute;left:50%;top:-2px;bottom:-2px;border-left:1px dashed var(--ink)}
.uf .vira{font-size:11.5px;font-weight:700;color:var(--lula)}
.kpi .v{font-weight:800;font-size:30px;line-height:1.05;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.kpi .r{font-size:13.5px;font-weight:700;margin-top:4px}
.kpi .n{font-size:12.5px;color:var(--ink-3);margin-top:2px}
.ok{color:var(--ok);font-weight:800} .bad{color:var(--bad);font-weight:800}
.tab{width:100%;border-collapse:collapse;font-size:13.5px;font-variant-numeric:tabular-nums}
.tab th{text-align:left;font-size:12px;color:var(--ink-2);font-weight:700;border-bottom:1px solid var(--ink-2);padding:6px 8px;white-space:nowrap}
.tab td{border-bottom:1px solid var(--rule);padding:8px;white-space:nowrap}
.tab .n{text-align:right}
.rolar{overflow-x:auto}
svg text{font-family:var(--sans)}
.grafico{width:100%;min-width:0;overflow:hidden}
.ctl > *{min-width:0}
.leg{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12.5px;color:var(--ink-2);margin-top:8px}
.leg i{display:inline-block;width:11px;height:11px;border-radius:2px;margin-right:5px;vertical-align:-1px}
details.metodo summary{cursor:pointer;font-weight:800}
details.metodo li{font-size:14px;color:var(--ink-2);margin:6px 0}
.rodape{background:var(--brand);color:var(--brand-ink);font-size:12.5px;margin-top:40px}
.rodape .in{max-width:1100px;margin:0 auto;padding-block:18px;opacity:.85}

@media (max-width:960px){
  .mapa-g{grid-template-columns:minmax(0,1fr)} .lateral{border-left:0;border-top:1px solid var(--rule)}
  .lab-g{grid-template-columns:minmax(0,1fr)} .res-lab{position:static;order:-1}
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:760px){
  .topo .in{grid-template-columns:1fr auto} .topo nav{display:none}
  .g3,.g2{grid-template-columns:minmax(0,1fr)}
  .livro .lin{grid-template-columns:minmax(0,1fr)} .livro .cab-l{display:none}
  .livro .lin > div[data-r]::before{display:block}
  .texto p{font-size:16.5px}
  .legenda-mapa{position:static;margin-bottom:8px;max-width:none}
}
@media (max-width:420px){ .g4{grid-template-columns:minmax(0,1fr)} }
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

function Faixas({linhas, lo=44, hi=56, marcas=[]}){
  const [ref, w] = useLargura();
  const x0 = 22, x1 = w-22, X = v => x0 + (Math.max(lo,Math.min(hi,v))-lo)/(hi-lo)*(x1-x0);
  const top = 34, rh = 62, H = top + rh*linhas.length + 46;
  const passo = w < 480 ? 4 : 2; const ticks = []; for (let v=lo; v<=hi; v+=passo) ticks.push(v);
  return html`<div ref=${ref} className="grafico"><svg width=${w} height=${H} role="img" aria-label="Faixas de 90% das simulações e resultado">
    <rect x=${X(50)} y=${top-6} width=${x1-X(50)} height=${H-top-24} style=${{fill:'var(--surface-2)'}}/>
    ${ticks.map(v => html`<g key=${v}>${L(X(v),top-6,X(v),H-24,'var(--rule)',{d:'3 3'})}${T(X(v),H-8,v+'%',{a:'middle'})}</g>`)}
    ${L(X(50),top-6,X(50),H-24,'var(--ink-2)')}
    ${T(X(50)-6,H-30,'Flávio vence',{a:'end',c:'var(--ink-3)'})}${T(X(50)+6,H-30,'Lula vence',{c:'var(--ink-3)'})}
    ${marcas.map((m,i) => html`<g key=${'m'+i}>${L(X(m.v),top-14,X(m.v),H-24,m.c,{w:m.w||1.5,d:m.d})}${T(X(m.v)+(m.lado==='e'?-6:6),top-18,m.rot,{a:m.lado==='e'?'end':'start',c:m.c,fw:700})}</g>`)}
    ${linhas.map((l,i) => { const y = top + rh*i + 40; return html`<g key=${'l'+i}>
      ${T(x0, y-20, l.tit, {c:'var(--ink)', fw:700, fs:13})}
      <rect x=${X(l.f.lo)} y=${y-11} width=${Math.max(2,X(l.f.hi)-X(l.f.lo))} height=${22} rx="3" style=${{fill:l.fx, stroke:l.c}}/>
      ${L(X(l.f.md),y-11,X(l.f.md),y+11,l.c,{w:3})}</g>`; })}
  </svg></div>`;
}

function Histograma({r}){
  const [ref, w] = useLargura(400);
  const H = 210, x0 = 18, x1 = w-18, y0 = 30, y1 = H-28, a = 40, b = 60, bw = .25;
  const X = v => x0 + (Math.max(a,Math.min(b,v))-a)/(b-a)*(x1-x0);
  const nb = Math.round((b-a)/bw), cnt = new Array(nb).fill(0);
  for (const x of r.amostra){ const k = Math.floor((x-a)/bw); if (k>=0&&k<nb) cnt[k]++; }
  const mx = Math.max(...cnt, 1), bwp = (x1-x0)/nb;
  const ticks = []; for (let v=a; v<=b; v+=(w<380?5:4)) ticks.push(v);
  return html`<div ref=${ref} className="grafico"><svg width=${w} height=${H} role="img" aria-label="Distribuição das simulações">
    <rect x=${X(50)} y=${y0} width=${x1-X(50)} height=${y1-y0} style=${{fill:'var(--surface-2)'}}/>
    <rect x=${X(r.lo)} y=${y0} width=${Math.max(1,X(r.hi)-X(r.lo))} height=${y1-y0} style=${{fill:'var(--video-f)'}}/>
    ${cnt.map((c,k) => c ? html`<rect key=${k} x=${X(a+k*bw)+.5} y=${y1-(c/mx)*(y1-y0-22)} width=${Math.max(1,bwp-1)} height=${(c/mx)*(y1-y0-22)} style=${{fill:'var(--video)'}}/>` : null)}
    ${L(X(REAL),y0-12,X(REAL),y1,'var(--lula)',{w:2})}${T(X(REAL)+4,y0-16,'urna 51,8%',{c:'var(--lula)',fw:700})}
    ${L(X(PESQ),y0-12,X(PESQ),y1,'var(--ink)',{d:'3 3'})}${T(X(PESQ)-4,y0-16,'pesquisas 49,1%',{a:'end',c:'var(--ink)'})}
    ${L(x0,y1,x1,y1,'var(--ink-3)')}
    ${ticks.map(v => html`<g key=${'t'+v}>${T(X(v),H-8,v+'%',{a:'middle'})}</g>`)}
  </svg></div>`;
}

  const det = useMemo(() => projetar({refs, extra:st.extra*1e6, m:st.m/100, sw:st.sw}), [st]);
  const gap = useMemo(() => lacuna(refs), [st.ano]);
  const ef1 = projetar({refs}).pct[0] - VID_PCT;

          <div className="linha"><input type="range" id="r-extra" min="0" max="7" step="0.05" value=${st.extra} onChange=${e=>set({extra:+e.target.value})}/><output>${sinal(st.extra,2)} mi</output></div>

          <div className="linha" style=${{marginTop:6}}><label htmlFor="r-m">Desses, votam em Lula</label><output>${st.m}%</output></div>
          <input type="range" id="r-m" min="0" max="100" step="1" value=${st.m} onChange=${e=>set({m:+e.target.value})}/>

  const val = (p, k) => { const l = p[2], f = p[3]; const x = k==='lula' ? l : f; return valido ? 100*x/(l+f) : x; };

  const serie = k => inst==='Todos'
    ? [[5,9],[10,14],[15,19],[20,24]].map(([a,b]) => { const vs = P.filter(p=>p[0]>=a&&p[0]<=b).map(p=>val(p,k)); return [(a+b)/2, soma(vs)/vs.length]; })
    : lista.map(p => [p[0], val(p,k)]);
  const CANDS = [['lula','Lula','PT','var(--lula)','LU'],['flavio','Flávio Bolsonaro','PL','var(--flavio)','FB']];
  const ticks = []; for (let v=Math.ceil(lo/5)*5; v<=hi; v+=5) ticks.push(v);

  return html`<section className="modulo largo gut" id="pesquisas">
    <div className="mod-cab"><div><h3>Pesquisas de 2º turno para presidente</h3><p>54 levantamentos registrados no TSE entre 7 e 24/10/2026, com a projeção do vídeo e a urna no dia 25</p></div></div>

      <label><span className="rot">Pergunta</span><select id="f-perg" value=${perg} onChange=${e=>setPerg(e.target.value)}><option value="validos">Votos válidos</option><option value="totais">Votos totais (estimulada)</option></select></label>
    </div>
    <div className="cartao">
      <div style=${{fontSize:20, fontWeight:800}}>${valido?'Votos válidos':'Estimulada, votos totais'}</div>
      <div style=${{fontSize:13, color:'var(--ink-2)'}}>em %. Clique nos ícones abaixo para destacá-los no gráfico.</div>
      <div className="avs" role="group" aria-label="Séries do gráfico">
        ${CANDS.map(([k,n,p,c,ini]) => html`<button key=${k} id=${'v-'+k} aria-pressed=${vis[k]} onClick=${()=>setVis(s=>({...s,[k]:!s[k]}))}><${Av} txt=${ini} cor=${c}/>${n}<span className="partido" style=${{background:c, justifySelf:'center'}}>${p}</span></button>`)}
        ${valido ? html`<button id="v-video" aria-pressed=${vis.video} onClick=${()=>setVis(s=>({...s,video:!s.video}))}><${Av} txt="V" cor="var(--video)"/>Projeção do vídeo</button>
        <button id="v-razo" aria-pressed=${vis.razo} onClick=${()=>setVis(s=>({...s,razo:!s.razo}))}><${Av} txt="R" cor="var(--razo)"/>Modelo razoável</button>` : null}
      </div>
      <div ref=${ref} className="grafico"><svg width=${w} height=${H} role="img" aria-label="Gráfico de linhas das pesquisas de segundo turno">
        ${datas.map(d => html`<g key=${'d'+d}>${L(X(d),y0-6,X(d),y1,'var(--rule)')}${T(X(d),y0-10,d+'/10',{a:'middle',c:'var(--ink-3)'})}${T(X(d),H-10,d+'/10',{a:'middle',c:'var(--ink-3)'})}</g>`)}
        ${ticks.map(v => html`<g key=${'y'+v}>${L(x0,Y(v),x1,Y(v),'var(--rule)',{d:'4 4'})}${T(x0-6,Y(v)+4,v+'%',{a:'end',c:'var(--ink-3)'})}</g>`)}
        ${valido ? L(x0,Y(50),x1,Y(50),'var(--ink-3)') : null}
        ${CANDS.map(([k,n,p,c]) => vis[k] ? html`<g key=${k}>
          ${inst==='Todos' ? lista.map((q,j) => html`<circle key=${j} cx=${X(q[0])+((j%5)-2)*2.4} cy=${Y(val(q,k))} r="3" style=${{fill:c, opacity:.22}}/>`) : null}
          <polyline points=${serie(k).map(([d,v])=>`${X(d)},${Y(v)}`).join(' ')} strokeWidth="2.5" style=${{fill:'none', stroke:c}}/>
          ${serie(k).map(([d,v],j) => html`<circle key=${'p'+j} cx=${X(d)} cy=${Y(v)} r="3.5" style=${{fill:c}}/>`)}
        </g>` : null)}
        ${vis.lula && fimL ? T(X(fimL[0])+8, Y(fimL[1])+(fimL[1]>(fimF?.[1]??0)?-6:14), fmt(fimL[1]), {c:'var(--lula)', fw:800}) : null}
        ${vis.flavio && fimF ? T(X(fimF[0])+8, Y(fimF[1])+(fimF[1]>=(fimL?.[1]??0)?-6:14), fmt(fimF[1]), {c:'var(--flavio)', fw:800}) : null}
        ${valido ? html`<g>
          <circle cx=${X(25)} cy=${Y(REAL)} r="6" style=${{fill:'var(--lula)'}}/>${w>=520 ? T(X(25)+10, Y(REAL)+4, 'Urna: Lula 51,8', {fw:700, c:'var(--lula)'}) : null}
          ${vis.video ? html`<g><circle cx=${X(25)} cy=${Y(VID_PCT)} r="5.5" style=${{fill:'var(--video)'}}/>${w>=520 ? T(X(25)+10, Y(VID_PCT)+4, 'Vídeo: Lula '+fmt(VID_PCT), {fw:700, c:'var(--video)'}) : null}</g>` : null}
          ${vis.razo ? html`<g><circle cx=${X(25)} cy=${Y(MOD.razo.uf.md)} r="5.5" style=${{fill:'var(--razo)'}}/>${w>=520 ? T(X(25)+10, Y(MOD.razo.uf.md)+4, 'Razoável: Lula '+fmt(MOD.razo.uf.md), {fw:700, c:'var(--razo)'}) : null}</g>` : null}
        </g>` : null}
      </svg></div>
      <p className="legenda">${inst==='Todos' ? 'Linha: média de cada semana, pela data de fim do campo. Pontos claros: cada pesquisa.' : `Pesquisas ${inst} pela data de fim do campo.`} ${valido?'Votos válidos calculados sem brancos, nulos e indecisos.':'Percentual sobre o total de entrevistados, como divulgado.'}</p>
    </div>
  </section>`;
}

/* ---------- ELEITOR PROVÁVEL ---------- */
function BarrasAbst(){
  const [ref, w] = useLargura(400);
  const H = 220, x0 = 8, x1 = w-8, y0 = 18, y1 = H-30, lo = -2.5, hi = 4;
  const Y = v => y1 - (v-lo)/(hi-lo)*(y1-y0), bw = (x1-x0)/D.abst.length;
  return html`<div ref=${ref} className="grafico"><svg width=${w} height=${H} role="img" aria-label="Variação da abstenção entre os turnos">
    ${L(x0,Y(0),x1,Y(0),'var(--ink-2)')}
    ${D.abst.map((a,i) => { const x = x0+bw*i+bw*.18, wb = bw*.64, cor = a.d<0 ? 'var(--razo)' : 'var(--video)';
      return html`<g key=${i}><rect x=${x} y=${Math.min(Y(0),Y(a.d))} width=${wb} height=${Math.abs(Y(a.d)-Y(0))} rx="2" style=${{fill:cor}}/>
        ${T(x+wb/2, a.d>=0?Y(a.d)-5:Y(a.d)+14, sinal(a.d), {a:'middle', fw:700, c:'var(--ink)'})}
        ${T(x+wb/2, H-10, a.ano, {a:'middle', fw:a.ano==='2026'?800:400})}</g>`; })}
  </svg></div>`;
}
function BarrasTurnos(){
  const [ref, w] = useLargura(600);
  const lado = w >= 560, nomes = ['Datafolha','Quaest','AtlasIntel','MDA','Gerp','Urna'];
  const lab = 84, rh = 26, top = 46, pw = lado ? (w-lab-30)/2 : w-lab-8, lo = -8, hi = 8;
  const blocoH = top + rh*nomes.length + 6, H = lado ? blocoH : blocoH*2;
  return html`<div ref=${ref} className="grafico"><svg width=${w} height=${H} role="img" aria-label="Vantagem de Lula nas pesquisas da véspera e na urna">
    ${TURNOS.map((t,k) => { const ox = lado ? lab + k*(pw+30) : lab, oy = lado ? 0 : k*blocoH, X = v => ox + (v-lo)/(hi-lo)*pw;
      const linhas = t.p.map(([n,l,f]) => [n, l-f]).concat([['Urna', t.urna]]);
      return html`<g key=${k}>
        ${T(ox, oy+14, t.tit, {fw:800, c:'var(--ink)', fs:13})}
        ${T(X(0)-5, oy+34, 'Flávio à frente', {a:'end', c:'var(--ink-3)'})}${T(X(0)+5, oy+34, 'Lula à frente', {c:'var(--ink-3)'})}
        ${L(X(0), oy+top-6, X(0), oy+blocoH-4, 'var(--ink-2)')}
        ${linhas.map(([n,v],i) => { const y = oy+top+rh*i+rh/2, u = n==='Urna';
          return html`<g key=${i}>${(lado&&k===1)?null:T(0, y+4, n, {fw:u?800:500, c:'var(--ink)', fs:12.5})}
            <rect x=${Math.min(X(0),X(v))} y=${y-(u?8:6)} width=${Math.abs(X(v)-X(0))} height=${u?16:12} rx="2" style=${{fill:v>=0?'var(--lula)':'var(--flavio)', opacity:u?1:.5}}/>
            ${T(X(v)+(v>=0?5:-5), y+4, sinal(v), {a:v>=0?'start':'end', fw:u?800:400, c:'var(--ink)'})}</g>`; })}
      </g>`; })}
  </svg></div>`;
}

}

      <div className="lab-g">

            <div className="pilulas"><button id="lv-prem" aria-pressed=${novos===0} onClick=${()=>setNovos(0)}>Premissa do filtro: ninguém a mais</button><button id="lv-real" aria-pressed=${Math.abs(novos-novosReal)<.01} onClick=${()=>setNovos(Math.round(novosReal*100)/100)}>O real: +${fmt(novosReal,2)} mi</button></div>

  lin.sort(ordem==='erro' ? (a,b)=>(b.r-b.v)-(a.r-a.v) : (a,b)=>NOME_UF[a.u].localeCompare(NOME_UF[b.u]));

        </div>`; })}
    </div>
  </section>`;
}

/* ---------- DESDE 1989 ---------- */
function Historia(){
  const [mod, setMod] = useState('video');
  const [err, setErr] = useState('uf');
  const H_ = D.hist.map(h => ({...h, f:h[mod][err]}));
  const fora = H_.filter(h => h.real<h.f.lo || h.real>h.f.hi).length;
  const erro = soma(H_.map(h => Math.abs(h.real-h.f.md)))/H_.length;
  const errados = H_.filter(h => (h.f.md>50)!==(h.real>50));
  const meia = soma(H_.map(h => (h.f.hi-h.f.lo)/2))/H_.length;
  const [ref, w] = useLargura(800);
  const estreito = w < 620, lab = estreito ? 0 : 150, lo = 34, hi = 78, x1 = w-10;
  const X = v => lab + 8 + (Math.max(lo,Math.min(hi,v))-lo)/(hi-lo)*(x1-lab-8);
  const rh = estreito ? 58 : 44, top = 10, Ht = top + rh*H_.length + 26;
  const ticks = []; for (let v=35; v<=75; v+=(estreito?10:5)) ticks.push(v);
  const cor = mod==='video' ? 'var(--video)' : 'var(--razo)', corF = mod==='video' ? 'var(--video-f)' : 'var(--razo-f)';
  return html`<section className="modulo largo gut" id="historia">
    <div className="mod-cab"><div><h3>As premissas do vídeo em todas as eleições desde 1989</h3><p>Cada 2º turno projetado com a eleição anterior e o mesmo fator aleatório. Votos válidos do candidato do PT.</p></div></div>
    <div className="filtros">
      <div><span className="rot" id="h-mod">Premissas</span><div className="pilulas" role="group" aria-labelledby="h-mod">
        <button id="h-video" aria-pressed=${mod==='video'} onClick=${()=>setMod('video')}>Do vídeo: só a eleição anterior</button>
        <button id="h-media" aria-pressed=${mod==='media'} onClick=${()=>setMod('media')}>Média de todas as anteriores</button></div></div>
      <div><span className="rot" id="h-err">Erro sorteado</span><div className="pilulas" role="group" aria-labelledby="h-err">
        <button id="h-uf" aria-pressed=${err==='uf'} onClick=${()=>setErr('uf')}>Por estado</button>
        <button id="h-nac" aria-pressed=${err==='nac'} onClick=${()=>setErr('nac')}>Comum ao país</button></div></div>
    </div>
    <div className="g4" style=${{marginBottom:12}}>
      <div className="cartao kpi"><div className=${'v '+(fora>2?'bad':'')}>${fora} de ${H_.length}</div><div className="r">eleições fora da própria faixa de 90%</div><div className="n">um método calibrado erraria 1 em 10</div></div>
      <div className="cartao kpi"><div className="v">${pts(erro)}</div><div className="r">erro médio da mediana</div><div className="n">diferença entre a projeção e a urna</div></div>
      <div className="cartao kpi"><div className="v">±${fmt(meia)}</div><div className="r">margem média anunciada</div><div className="n">metade da largura da faixa de 90%</div></div>
      <div className="cartao kpi"><div className=${'v '+(errados.length?'bad':'')}>${errados.length}</div><div className="r">vencedor errado</div><div className="n">${errados.length?errados.map(h=>h.ano).join(', '):'nenhum'}</div></div>
    </div>
    <div className="cartao">
      <div ref=${ref} className="grafico"><svg width=${w} height=${Ht} role="img" aria-label="Faixas de 90% e resultados de 2002 a 2026">
        ${ticks.map(v => html`<g key=${v}>${L(X(v),top,X(v),Ht-22,'var(--rule)',{d:'3 3'})}${T(X(v),Ht-6,v+'%',{a:'middle'})}</g>`)}
        ${L(X(50),top,X(50),Ht-22,'var(--ink-2)')}
        ${H_.map((h,i) => { const y = top + rh*i + (estreito?36:rh/2), dentro = h.real>=h.f.lo && h.real<=h.f.hi, e = h.real-h.f.md, dir = h.real > h.f.md;
          return html`<g key=${h.ano}>
            ${estreito ? T(0, y-17, `${h.ano}  ${h.disputa}  (base ${mod==='video'?h.ref:'média'})`, {fw:700, c:'var(--ink)', fs:12.5})
              : html`<g>${T(0, y-2, h.ano, {fw:800, c:'var(--ink)', fs:14})}${T(0, y+13, h.disputa, {fs:11.5})}</g>`}
            <rect x=${X(h.f.lo)} y=${y-9} width=${Math.max(2,X(h.f.hi)-X(h.f.lo))} height="18" rx="3" style=${{fill:corF, stroke:cor}}/>
            ${L(X(h.f.md),y-9,X(h.f.md),y+9,cor,{w:3})}
            ${L(X(h.f.md),y,X(h.real),y,'var(--ink-3)',{d:'2 3'})}
            <circle cx=${X(h.real)} cy=${y} r="6" style=${{fill:dentro?'var(--ok)':'var(--bad)'}}/>
            ${T(X(h.real)+(dir?10:-10), y+4, `${fmt(h.real)}% (${sinal(e)})`, {a:dir?'start':'end', fw:700, c:'var(--ink)', fs:12})}
          </g>`; })}
      </svg></div>
      <div className="leg"><span><i style=${{background:corF, boxShadow:'inset 0 0 0 1px '+cor}}></i>faixa de 90% do modelo</span><span><i style=${{background:'var(--ok)'}}></i>urna dentro da faixa</span><span><i style=${{background:'var(--bad)'}}></i>urna fora da faixa</span></div>
    </div>
    <div className="cartao rolar" style=${{marginTop:12}}>
      <table className="tab">
        <thead><tr><th>Eleição</th><th>Disputa</th><th>Base</th><th className="n">Projeção</th><th className="n">Faixa de 90%</th><th className="n">Urna</th><th className="n">Erro</th><th>Na faixa?</th></tr></thead>
        <tbody>${H_.map(h => { const dentro = h.real>=h.f.lo && h.real<=h.f.hi; return html`<tr key=${h.ano}><td><b>${h.ano}</b></td><td>${h.disputa}</td><td>${mod==='video'?h.ref:'todas as anteriores'}</td><td className="n">${fmt(h.f.md)}%</td><td className="n">${fmt(h.f.lo)} a ${fmt(h.f.hi)}%</td><td className="n">${fmt(h.real)}%</td><td className="n">${sinal(h.real-h.f.md)}</td><td className=${dentro?'ok':'bad'}>${dentro?'sim':'não'}</td></tr>`; })}</tbody>
      </table>
    </div>
  </section>`;
}

      <nav aria-label="Seções"><a href="#mapa">Mapa</a><a href="#modelos">Modelos</a><a href="#pesquisas">Pesquisas</a><a href="#estados">Estados</a><a href="#historia">Desde 1989</a></nav>
    </div></header>
    <main id="topo">
      <div className="col gut cabeca">
        <p className="chapeu">Análise de dados</p>
        <h1>A conta de Tarcísio com outras premissas dá Lula</h1>
        <p className="fina">Refiz com os dados do TSE a projeção que Tarcísio publicou no dia do 2º turno, com a mesma fórmula e o mesmo Monte Carlo. Ele copiou o 2º turno de 2022 e deixou a campanha de fora. Trocando 2022 pela média das eleições desde 1989 e incluindo a tendência das pesquisas, a mesma conta dá Lula.</p>
        <div className="byline"><span>Por <b>Rodolfo Carvalho</b>, 28/10/2026</span></div>
        <details className="resumo" id="resumo"><summary>Ver resumo</summary><ul>
          <li>Refeita com os dados do TSE, a planilha do vídeo dá os mesmos números: Flávio com 52,6% e 90% das simulações entre 51,8% e 53,6%.</li>
          <li>Com a média dos 2º turnos desde 1989 no lugar de 2022 e com a tendência das pesquisas, a mesma conta dá Lula com 50,7%, e ele vence em 9 de cada 10 simulações.</li>
          <li>Lula superou a projeção do vídeo nos 27 estados. O comparecimento subiu 2,96 milhões no 2º turno, a maior alta entre turnos desde 2002.</li>
          <li>Aplicado às eleições desde 1989, o método do vídeo deixou a urna fora da própria faixa de 90% em 5 de 7 vezes.</li>
        </ul></details>
      </div>
      <${Col}>
        <p>No domingo do 2º turno (25), o governador de São Paulo, Tarcísio de Freitas, publicou no X um vídeo com uma projeção feita em planilha: Flávio Bolsonaro com 52,6% dos votos válidos e 90% das simulações entre 51,8% e 53,6%. A apuração terminou com Lula reeleito, com 51,79%. Tarcísio reconheceu o resultado dois dias depois, sem falar em fraude. O vídeo voltou a circular no YouTube com o título “Tarcísio antecipou a fraude com matemática” e passou de 500 mil visualizações em um dia.</p>
        <p>Refiz a conta estado por estado, e ela bate com o vídeo. Quem decide o vencedor são as premissas, que o vídeo apresenta como se fossem dado. No mapa, cada estado aparece com o resultado da urna e com o que a planilha previa.</p>
      </${Col}>
      <${Mapa}/>
      <${Col}>
        <h2>A mesma conta com outras premissas</h2>
        <p>O vídeo copia a divisão de votos de 2022 e ignora as três semanas de campanha. Os dois são indicadores defasados, porque olham para o que já passou. O modelo razoável usa a mesma fórmula com a média dos 2º turnos desde 1989. Além disso, acrescenta o indicador antecedente que havia na véspera, a tendência das pesquisas (Lula ganhou 1 ponto entre a primeira e a última semana).</p>
      </${Col}>
      <${Modelos}/>
      <${Col}><h2>As premissas, uma a uma</h2><p>Cada linha é uma escolha feita antes da conta, e a última coluna traz o que a urna mostrou.</p></${Col}>
      <${Livro}/>
      <${Laboratorio}/>
      <${Col}>
        <h2>O que as pesquisas mostravam</h2>
        <p>Nenhum grande instituto deu Lula à frente no 2º turno. Porém a diferença vinha fechando: no Datafolha, Lula foi de 47,9% para 49,5% dos válidos e, na AtlasIntel, de 47,2% para 49,2%. O vídeo partiu do 1º turno e deixou esse movimento de fora.</p>
      </${Col}>
      <${Pesquisas}/>
      <${Col}>
        <h2>O filtro de eleitor provável também olhou para trás</h2>
        <p>Os institutos descartam da amostra quem provavelmente não vai votar e calibram esse filtro com as eleições passadas. Até 2018, a abstenção sempre subia do 1º para o 2º turno. Em 2026, caiu 1,86 ponto. Na véspera do 1º turno, quatro de cinco institutos davam Lula à frente, e Flávio venceu por 1,9 ponto. Na véspera do 2º, todos davam Flávio, e Lula venceu por 3,6. Nenhum deles acertou o vencedor nos dois turnos.</p>
      </${Col}>
      <${EleitorProvavel}/>
      <${Col}>
        <p>Por município, o comparecimento subiu de 1,2 a 2,3 pontos em todas as faixas de votação de Lula, e subiu menos onde ele era mais forte. Então a virada não veio de um mapa diferente de comparecimento.</p>
      </${Col}>
      <${Estados}/>
      <${Col}>
        <h2>O teste que o vídeo não fez</h2>
        <p>Antes de publicar um modelo de previsão, confere-se se ele teria acertado as eleições passadas. Apliquei o método do vídeo a todos os 2º turnos desde 1989, sempre com a eleição anterior como molde. A mediana errou 5,9 pontos em média (17,6 pontos em 2010), enquanto as margens anunciadas iam de 0,9 a 2,9 pontos para cada lado. Em 2022, daria a Bolsonaro 46,4%; ele teve 49,1%. Pela régua do vídeo, Bolsonaro teria sido favorecido em 2022.</p>
      </${Col}>
      <${Historia}/>
      <${Col}>
        <h2>Modelo e premissa</h2>
        <p>Uso modelo todo dia no trabalho, e todo modelo carrega as hipóteses de quem o montou. Porém, quando a planilha dá ar de ciência a escolhas que não são matemáticas (qual eleição copiar, quais eleitores existem, se a campanha conta, quanta incerteza admitir), a escolha fica escondida atrás da conta.</p>
        <p>Se a previsão falha, revisa-se a premissa e refaz-se a conta. Chamar o resultado de impossível faz o contrário e transforma uma hipótese de planilha em acusação contra 128 milhões de eleitores.</p>
        <details className="metodo cartao" id="det-metodo" style=${{marginTop:20}}>
          <summary>Como foi feito e fontes</summary>
          <ul>
            <li>Fórmula do vídeo, por estado: voto no 2º turno = voto no 1º turno + votos dos outros candidatos × taxa de transferência × fator aleatório. A taxa é o ganho de cada candidato entre os turnos da eleição de referência dividido pelos votos dos outros candidatos no 1º turno dela.</li>
            <li>Fator aleatório: normal com média 1 e desvio 0,55, que reproduz a faixa do vídeo. Um sorteio por estado e candidato ou, no erro comum ao país, um por candidato. A reprodução dá Flávio com 62,97 mi e Lula com 56,75 mi.</li>
            <li>Modelo razoável: a mesma fórmula, com a taxa média dos sete 2º turnos de 1989 a 2022 e +1,0 ponto para Lula, a variação da média das pesquisas entre a primeira e a última semana do 2º turno.</li>
            <li>Candidato do PT contra Collor (1989), PSDB (2002 a 2014), PSL (2018) e PL (2022 e 2026). Votos no exterior entram como uma unidade a mais e ficam fora do mapa.</li>
            <li>Resultados de 2002 a 2026 e comparecimento por município: <a href="https://dadosabertos.tse.jus.br/" target="_blank" rel="noopener">Portal de Dados Abertos do TSE</a>. 1989: tabela por estado da <a href="https://pt.wikipedia.org/wiki/Elei%C3%A7%C3%A3o_presidencial_no_Brasil_em_1989" target="_blank" rel="noopener">Wikipédia</a>. Malha dos estados: <a href="https://servicodados.ibge.gov.br/api/docs/malhas" target="_blank" rel="noopener">API de malhas do IBGE</a>.</li>
            <li>Pesquisas de 2º turno: levantamentos registrados no TSE compilados na <a href="https://en.wikipedia.org/wiki/Opinion_polling_for_the_2026_Brazilian_presidential_election" target="_blank" rel="noopener">Wikipédia</a>. Véspera dos dois turnos: <a href="https://portalleodias.com/politica/pesquisas-eleitorais-erram-resultados-no-1o-e-no-2o-turno-das-eleicoes-de-2026" target="_blank" rel="noopener">Portal Leo Dias</a>.</li>
            <li>Vídeo da projeção: <a href="https://www.poder360.com.br/poder-eleicoes-2026/tarcisio-fez-projecao-errada-do-resultado-da-eleicao-veja-video/" target="_blank" rel="noopener">Poder360</a>. Republicação como prova de fraude: <a href="https://www.youtube.com/watch?v=lbZYjtOTFBs" target="_blank" rel="noopener">YouTube</a>.</li>
          </ul>
        </details>
      </${Col}>
